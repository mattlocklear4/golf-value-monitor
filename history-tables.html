<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournament History Tables</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif;background:#08111e;color:#e3efff}*{box-sizing:border-box}body{margin:0;padding:12px}header{margin-bottom:16px}.muted{color:#9db5d0;font-size:13px}h2{margin:0 0 6px;font-size:20px}h3{margin:0 0 12px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}label{font-size:13px;color:#afc8e6;display:flex;flex-direction:column;gap:5px}select,button{background:#14263b;color:#e5f0ff;border:1px solid #36506b;border-radius:7px;padding:9px;max-width:100%}button{cursor:pointer}.year{border:1px solid #29415c;border-radius:12px;padding:15px;margin:14px 0;background:#0d1b2d}.year-grid{display:grid;grid-template-columns:minmax(310px,40%) minmax(0,60%);gap:18px;align-items:start}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px 6px;border-bottom:1px solid #29415a;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{background:#19354b;color:#c7e8f8}tr.total{background:#1d3b4e;font-weight:bold}.easy{color:#66d9a6}.hard{color:#ffad83}.chartbox{position:relative;min-width:0}.chart{width:100%;height:250px;display:block;touch-action:pan-y}.tip{position:absolute;pointer-events:none;z-index:5;display:none;background:#14263b;border:1px solid #6587a6;border-radius:6px;padding:8px;font-size:12px;white-space:nowrap;box-shadow:0 4px 15px #0008}.legend{display:flex;gap:15px;font-size:12px;color:#b8cde4;margin-top:6px}.legend span:before{content:' ';display:inline-block;width:14px;height:3px;background:var(--c);vertical-align:middle;margin-right:5px}.warning{color:#f8c48c}.status{font-size:13px;color:#9fb9d2;margin-top:8px}.year-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.year-head select{font-size:12px;padding:5px}@media(max-width:950px){.year-grid{grid-template-columns:1fr}.chart{height:230px}}@media(max-width:450px){body{padding:6px}.year{padding:8px}th,td{padding:7px 4px;font-size:11px}}
.course-picker{display:flex;flex-direction:column;gap:5px;min-width:185px;max-width:100%;position:relative}.course-label{font-size:13px;color:#afc8e6}.course-picker summary{cursor:pointer;background:#14263b;color:#e5f0ff;border:1px solid #36506b;border-radius:7px;padding:9px;font-size:13px;max-width:300px;overflow-wrap:anywhere}.course-menu{position:absolute;z-index:20;top:100%;left:0;min-width:230px;width:max-content;max-width:min(360px,90vw);background:#14263b;border:1px solid #36506b;border-radius:7px;padding:10px;box-shadow:0 6px 20px #0008}.course-actions{display:flex;gap:8px;margin-bottom:8px}#courseOptions{max-height:260px;overflow:auto}#courseOptions label{display:flex;flex-direction:row;align-items:center;gap:8px;padding:7px 2px;cursor:pointer}#courseOptions input{accent-color:#54bc98;flex:none}#courseOptions label span{overflow-wrap:anywhere}.course-note{margin:0 0 10px;color:#9db5d0;font-size:12px}
</style></head><body><header><h2>⛳ Tournament History Tables</h2><div class="muted">Round scoring, driving accuracy and GIR beside seven-day historical wind. Uses existing local caches only. Select multiple tournament or course names to combine historical editions.</div></header><div class="controls"><div class="course-picker"><span class="course-label" id="eventLabel">Tournaments</span><details id="eventMenu"><summary id="eventSummary" aria-labelledby="eventLabel eventSummary">Choose tournaments</summary><div class="course-menu"><div class="course-actions"><button type="button" id="eventAll">Select all</button><button type="button" id="eventNone">Clear</button></div><div id="eventOptions" role="group" aria-label="Tournaments to include"></div></div></details></div><div class="course-picker"><span class="course-label" id="courseLabel">Courses</span><details id="courseMenu"><summary id="courseSummary" aria-labelledby="courseLabel courseSummary">Choose courses</summary><div class="course-menu"><div class="course-actions"><button type="button" id="courseAll">Select all</button><button type="button" id="courseNone">Clear</button></div><div id="courseOptions" role="group" aria-label="Courses to include"></div></div></details></div><label>Season / year basis<select id="basis"><option value="B">Year (column B)</option><option value="C">Season (column C)</option></select></label><label>Weather matching<select id="match"><option value="auto">Automatic (course/name)</option></select></label><button id="refresh">Refresh cached data</button></div><div class="status" id="status"></div><div class="status" id="scoreBenchmark" role="status" style="margin-top:10px"></div><div id="years"></div>
<script>
(()=>{'use strict';const requestedWorkspace=new URLSearchParams(location.search).get('workspace')||'',workspace=/^(pga|euro):[0-9]{4}:[a-z0-9-]{1,120}$/.test(requestedWorkspace)?requestedWorkspace:'',H='gvm-v77-tournament-history'+(workspace?':'+workspace:''),W='golf-weather-library-v6',selectionKey='gvm-history-table-selection'+(workspace?':'+workspace:'');const $=id=>document.getElementById(id);let history=[],library=[],selectedCourses=new Set(),selectedEvents=new Set(),eventInitialized=false,courseEvent=null;
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=x=>x===''||x==null?NaN:Number(x);const avg=(rows,col)=>{let v=rows.map(r=>num(r[col])).filter(Number.isFinite);return v.length?v.reduce((a,b)=>a+b,0)/v.length:NaN};const fmt=(v,percent=false)=>Number.isFinite(v)?(percent?v*100:v).toFixed(2)+(percent?'%':''):'—';
function clock(x){let n=num(x);if(Number.isFinite(n)&&n>=0&&n<1)return Math.round(n*1440)%1440;let m=String(x||'').trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap]m)?$/i);if(!m)return NaN;let h=+m[1];if(m[3])h=h%12+(m[3].toLowerCase()==='pm'?12:0);return h*60+(+m[2]);}
function wave(r){let round=Number(r.K);if(round!==1&&round!==2)return '';let t=clock(r.P);return Number.isFinite(t)?(t<720?'AM':'PM'):'';}
function eventNames(rows){return [...new Set(rows.map(r=>r.D).filter(Boolean))].sort();}
function load(){try{history=JSON.parse(localStorage.getItem(H)||'null')?.rows||[]}catch{history=[]}try{library=JSON.parse(localStorage.getItem(W)||'null')?.entries||[]}catch{library=[]}library=library.filter(([k,v])=>v?.data&&v?.name);const events=eventNames(history);const previousCount=$('eventOptions').querySelectorAll('input').length;const previousAll=!eventInitialized||previousCount===selectedEvents.size;const retained=events.filter(x=>selectedEvents.has(x));selectedEvents=new Set(previousAll||(!retained.length&&selectedEvents.size)?events:retained);eventInitialized=true;drawEventOptions(events);updateCourses();$('status').textContent=`${history.length.toLocaleString()} historical player-round records · ${library.length} cached weather tournament datasets. No API calls made.`;}
function updateEventSummary(){const options=$('eventOptions').querySelectorAll('input'),n=selectedEvents.size;$('eventSummary').textContent=!n?'Choose tournaments':n===1?[...selectedEvents][0]:n===options.length?'All '+n+' tournaments':n+' tournament names selected';$('eventAll').disabled=!options.length||n===options.length;$('eventNone').disabled=!n;}
function drawEventOptions(events){const root=$('eventOptions');root.replaceChildren();for(const name of events){const label=document.createElement('label'),input=document.createElement('input'),span=document.createElement('span');input.type='checkbox';input.checked=selectedEvents.has(name);span.textContent=name;input.onchange=()=>{if(input.checked)selectedEvents.add(name);else selectedEvents.delete(name);updateEventSummary();updateCourses();};label.append(input,span);root.append(label);}updateEventSummary();}
function setAllEvents(on){selectedEvents=new Set(on?eventNames(history):[]);for(const input of $('eventOptions').querySelectorAll('input'))input.checked=on;updateEventSummary();updateCourses();}
function courseNames(rows,events){return [...new Set(rows.filter(r=>events.has(r.D)).map(r=>r.L).filter(Boolean))].sort();}
function selectCourseDefaults(courses,previous,sameEvent){return new Set(sameEvent?courses.filter(x=>previous.has(x)) : courses);}
function selectedRecords(rows,events,selected){return rows.filter(r=>events.has(r.D)&&selected.has(r.L));}
function yearCourses(rows){return [...new Set(rows.map(r=>r.L).filter(Boolean))].sort();}
function updateCourseSummary(){const options=$('courseOptions').querySelectorAll('input');const n=selectedCourses.size;$('courseSummary').textContent=!n?'Choose courses':n===1?[...selectedCourses][0]:n===options.length?'All '+n+' courses':n+' courses selected';$('courseAll').disabled=!options.length||n===options.length;$('courseNone').disabled=!n;}
function updateCourses(){const ev=JSON.stringify([...selectedEvents].sort()),courses=courseNames(history,selectedEvents);const sameEvent=ev===courseEvent;const previouslyAll=sameEvent&&$('courseOptions').querySelectorAll('input').length===selectedCourses.size;selectedCourses=selectCourseDefaults(courses,selectedCourses,sameEvent&&!previouslyAll);courseEvent=ev;const root=$('courseOptions');root.replaceChildren();for(const name of courses){const label=document.createElement('label'),input=document.createElement('input'),span=document.createElement('span');input.type='checkbox';input.checked=selectedCourses.has(name);span.textContent=name;input.onchange=()=>{if(input.checked)selectedCourses.add(name);else selectedCourses.delete(name);updateCourseSummary();render();};label.append(input,span);root.append(label);}updateCourseSummary();render();}
function setAllCourses(on){selectedCourses=new Set(on?courseNames(history,selectedEvents):[]);for(const input of $('courseOptions').querySelectorAll('input'))input.checked=on;updateCourseSummary();render();}
function matchScore(item,event,course){let n=norm(item.name),c=norm(course),e=norm(event);if(!n)return 0;let score=0;if(c&&n.includes(c))score+=10;if(e&&n.includes(e))score+=8;let words=c.split(' ').filter(w=>w.length>3);score+=words.filter(w=>n.split(' ').includes(w)).length;return score;}
function weatherChoices(event,course){let ranked=library.map(([key,item])=>({key,item,score:matchScore(item,event,course)})).sort((a,b)=>b.score-a.score);return ranked;}
function dayShift(date,n){let d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function buildScoreScale(records,basis){const mid=avg(records,'R'),groups=new Map();for(const r of records){const y=String(r[basis]);if(!groups.has(y))groups.set(y,[]);groups.get(y).push(r);}const values=[];for(const rows of groups.values()){for(const k of [1,2,3,4])values.push(avg(rows.filter(r=>Number(r.K)===k),'R'));values.push(avg(rows,'R'));}const valid=values.filter(Number.isFinite);return {low:valid.length?Math.min(mid,...valid):mid,mid,high:valid.length?Math.max(mid,...valid):mid};}
function scoreColor(value,scale){if(!Number.isFinite(value)||!Number.isFinite(scale.mid))return '';const {low,mid,high}=scale;const center=[234,224,183],green=[33,159,92],red=[220,75,75];const target=value<mid?green:red;const distance=value<mid?mid-low:high-mid;const t=distance>0?Math.min(1,Math.abs(value-mid)/distance):0;return 'rgb('+center.map((x,i)=>Math.round(x+(target[i]-x)*t)).join(',')+')';}
function scoreStyle(value,scale){const color=scoreColor(value,scale);return color?'background:'+color+';color:#101820;font-weight:650;':'';}
function table(rows,scale){let rounds=[1,2,3,4].map(i=>({i,rows:rows.filter(r=>Number(r.K)===i)}));let html='<div class="scroll"><table><thead><tr><th>Round</th><th>Score to par</th><th>Dr. Acc.</th><th>GIR</th><th>AM</th><th>PM</th><th>Players</th></tr></thead><tbody>';for(let x of rounds){let v=avg(x.rows,'R');html+=`<tr><td>R${x.i}</td><td style="${scoreStyle(v,scale)}">${fmt(v)}</td><td>${fmt(avg(x.rows,'Z'),true)}</td><td>${fmt(avg(x.rows,'AB'),true)}</td><td>${fmt(avg(x.rows.filter(r=>wave(r)==='AM'),'R'))}</td><td>${fmt(avg(x.rows.filter(r=>wave(r)==='PM'),'R'))}</td><td>${x.rows.length}</td></tr>`}html+=`<tr class="total"><td>Overall</td><td style="${scoreStyle(avg(rows,'R'),scale)}">${fmt(avg(rows,'R'))}</td><td>${fmt(avg(rows,'Z'),true)}</td><td>${fmt(avg(rows,'AB'),true)}</td><td>${fmt(avg(rows.filter(r=>wave(r)==='AM'),'R'))}</td><td>${fmt(avg(rows.filter(r=>wave(r)==='PM'),'R'))}</td><td>${rows.length}</td></tr></tbody></table></div><p class="muted">AM/PM are provisional tee-time splits (before/after noon) for R1–R2 only, not confirmed wave assignments. Weekend rounds are intentionally excluded from wave splits. Overall averages are player-round weighted.</p>`;return html;}
function render(){let basis=$('basis').value,records=selectedRecords(history,selectedEvents,selectedCourses).filter(r=>r[basis]!==''&&r[basis]!=null&&Number.isFinite(Number(r[basis]))&&Number(r[basis])>0);const scale=buildScoreScale(records,basis),benchmark=scale.mid,validCount=records.filter(r=>Number.isFinite(num(r.R))).length;const summary=$('scoreBenchmark');summary.replaceChildren();if(Number.isFinite(benchmark)){const strong=document.createElement('strong');strong.textContent='Combined scoring benchmark: '+fmt(benchmark);summary.append(strong,document.createTextNode(' · '+validCount.toLocaleString()+' player-rounds · '));summary.append(document.createTextNode('Shared color scale for every displayed year.'));const legend=document.createElement('div');legend.style.cssText='max-width:420px;margin:8px 0 5px';const bar=document.createElement('div');bar.style.cssText='height:12px;border-radius:4px;background:linear-gradient(90deg,rgb(33,159,92),rgb(234,224,183),rgb(220,75,75));border:1px solid #36506b';const labels=document.createElement('div');labels.style.cssText='display:flex;justify-content:space-between;gap:6px;font-size:12px;margin-top:4px';for(const [name,v] of [['Easiest',scale.low],['Average',scale.mid],['Hardest',scale.high]]){const span=document.createElement('span');span.textContent=name+' '+fmt(v);labels.append(span);}legend.append(bar,labels);summary.append(legend);}let years=[...new Set(records.map(r=>r[basis]).filter(Boolean))].sort((a,b)=>Number(b)-Number(a));let root=$('years');root.replaceChildren();if(!history.length){root.innerHTML='<p class="warning">No Tournament History cache found. Open Tournament History and refresh from OneDrive first.</p>';return}if(!years.length){root.innerHTML='<p class="muted">Choose at least one tournament and course with imported rounds.</p>';return}for(let year of years){let rr=records.filter(r=>String(r[basis])===String(year));let courses=yearCourses(rr),course=courses.join(' / '),events=eventNames(rr);let pairs=[...new Map(rr.map(r=>[JSON.stringify([r.D,r.L]),[r.D,r.L]])).values()];let choices=library.map(([key,item])=>({key,item,score:Math.max(0,...pairs.map(([event,venue])=>matchScore(item,event,venue)))})).sort((a,b)=>b.score-a.score);let box=document.createElement('section');box.className='year';let head=document.createElement('div');head.className='year-head';head.innerHTML=`<h3>${esc(year)} · ${esc(course)}</h3>`;let selector=document.createElement('select');selector.setAttribute('aria-label','Weather dataset for '+year);selector.append(new Option('No weather match',''));for(let x of choices)selector.append(new Option(x.item.name,x.key));let preferred=choices.find(x=>x.score>0&&x.item.data?.[String(year)]?.length);selector.value=preferred?.key||'';head.append(selector);box.append(head);let grid=document.createElement('div');grid.className='year-grid';let stats=document.createElement('div');stats.innerHTML=(events.length>1?'<p class="course-note">Combined tournament names: '+esc(events.join(', '))+'. If these represent separate events in the same year, select them separately for weather comparisons.</p>':'')+(courses.length>1?'<p class="course-note">Combined player-round statistics for '+esc(courses.join(', '))+'. Verify the weather dataset if these are different venues.</p>':'')+table(rr,scale);grid.append(stats);let weather=document.createElement('div');weather.className='chartbox';grid.append(weather);box.append(grid);root.append(box);let draw=()=>{let item=library.find(([k])=>k===selector.value)?.[1];weather.replaceChildren();if(!item){weather.innerHTML='<p class="warning">No matching cached weather. Download this tournament in Historical Weather, then click Refresh cached data here.</p>';return}let points=item.data?.[String(year)];if(!points?.length){weather.innerHTML='<p class="warning">No hourly weather saved for this year in the selected dataset.</p>';return}let start=item.starts?.[String(year)];if(!start){let dates=[...new Set(points.map(p=>p.t?.slice(0,10)).filter(Boolean))].sort();start=dates.find(d=>new Date(d+'T12:00:00Z').getUTCDay()===0)||dates[0];}let end=dayShift(start,7);let data=points.filter(p=>p.t?.slice(0,10)>=start&&p.t?.slice(0,10)<=end).sort((a,b)=>a.t.localeCompare(b.t));if(!data.length){weather.innerHTML='<p class="warning">No observations within the saved Sunday–Sunday weather window.</p>';return}let caption=document.createElement('div');caption.className='muted';caption.textContent=`${start} through ${end} · ${data.length} hourly observations · mph`;weather.append(caption);let canvas=document.createElement('canvas');canvas.className='chart';weather.append(canvas);let tip=document.createElement('div');tip.className='tip';weather.append(tip);let legend=document.createElement('div');legend.className='legend';legend.innerHTML='<span style="--c:#5db6ff">Wind speed</span><span style="--c:#ff9c5c">Gusts</span>';weather.append(legend);let note=document.createElement('div');note.className='muted';note.textContent='Shaded: Thu–Sun (assumed R1–R4 based on the saved Sunday–Sunday window; verify actual round dates for delayed or rescheduled events). Fixed scale: 0–40 mph.';weather.append(note);plot(canvas,tip,data,start);};selector.onchange=draw;draw();}}
function plot(canvas,tip,data,start){let ctx=canvas.getContext('2d'),left=34,right=10,top=15,bottom=30;let max=40;let W,H,coords=[];function paint(){W=canvas.clientWidth;H=canvas.clientHeight;let dpr=devicePixelRatio||1;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);let pw=W-left-right,ph=H-top-bottom;let dates=data.map(r=>new Date(r.t).getTime());let a=dates[0],b=dates.at(-1),x=t=>left+(t-a)/(b-a||1)*pw,y=v=>top+ph-(v/max)*ph;ctx.font='11px system-ui';ctx.fillStyle='#9fb6ce';ctx.strokeStyle='#29415a';for(let i=0;i<=4;i++){let yy=top+i*ph/4;ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(W-right,yy);ctx.stroke();ctx.fillText(String(Math.round(max*(1-i/4))),2,yy+3)}for(let i=0;i<=7;i++){let date=dayShift(start,i),ts=Date.parse(date+'T00:00:00Z');if(ts<a||ts>b)continue;let xx=x(ts);if(i>=4&&i<=7){ctx.fillStyle='rgba(100,169,255,.09)';let next=x(Math.min(b,ts+86400000));ctx.fillRect(xx,top,Math.max(0,next-xx),ph)}ctx.strokeStyle='#44617a';ctx.beginPath();ctx.moveTo(xx,top);ctx.lineTo(xx,top+ph);ctx.stroke();ctx.fillStyle='#b5c9dd';ctx.fillText(['Sun','Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i],Math.min(W-35,xx+3),H-7)}for(let [field,color] of [['wind','#5db6ff'],['gust','#ff9c5c']]){ctx.strokeStyle=color;ctx.lineWidth=1.8;ctx.beginPath();let begun=false;data.forEach((r,i)=>{let v=num(r[field]);if(!Number.isFinite(v))return;let xx=x(dates[i]),yy=y(v);if(!begun){ctx.moveTo(xx,yy);begun=true}else ctx.lineTo(xx,yy)});ctx.stroke()}coords=dates.map(x);}
function show(e){let rect=canvas.getBoundingClientRect(),px=e.clientX-rect.left;let a=coords[0],b=coords.at(-1),target=a+(px-left)/(W-left-right)*(b-a);let idx=0;for(let i=1;i<coords.length;i++)if(Math.abs(coords[i]-target)<Math.abs(coords[idx]-target))idx=i;let r=data[idx];tip.innerHTML=`${r.t?.replace('T',' ')}<br>Wind: ${Number.isFinite(num(r.wind))?num(r.wind)+' mph':'—'}<br>Gust: ${Number.isFinite(num(r.gust))?num(r.gust)+' mph':'—'}<br>From: ${Number.isFinite(num(r.dir))?Math.round(num(r.dir))+'°':'—'}`;tip.style.display='block';tip.style.left=Math.max(0,Math.min(W-150,px+12))+'px';tip.style.top='25px';}canvas.addEventListener('pointermove',show);canvas.addEventListener('pointerdown',show);canvas.addEventListener('pointerleave',()=>tip.style.display='none');if('ResizeObserver'in window)new ResizeObserver(paint).observe(canvas);else window.addEventListener('resize',paint);paint();}
$('eventAll').onclick=()=>setAllEvents(true);$('eventNone').onclick=()=>setAllEvents(false);$('courseAll').onclick=()=>setAllCourses(true);$('courseNone').onclick=()=>setAllCourses(false);document.addEventListener('click',e=>{if(!$('courseMenu').contains(e.target))$('courseMenu').open=false;if(!$('eventMenu').contains(e.target))$('eventMenu').open=false;});$('basis').onchange=render;$('refresh').onclick=load;window.addEventListener('storage',e=>{if(e.key===H||e.key===W)load()});load();})();
</script></body></html>
